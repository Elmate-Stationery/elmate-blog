<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Tag — Elmate Stationery Blogs</title>
    <meta id="meta-description" name="description" content="" />
    <link rel="icon" href="../public/favicon/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  </head>
  <body class="font-body antialiased">
    <div id="navbar-root"></div>
    <div id="search-modal-root"></div>
    <main id="main-content" class="max-w-6xl mx-auto px-4 sm:px-6 py-12">
      <div class="mb-10" data-aos="fade-up">
        <span class="annotation font-mono text-xs">Tag</span>
        <h1
          id="tag-title"
          class="font-display text-3xl sm:text-4xl font-semibold mt-2"
        ></h1>
        <p
          id="results-count"
          class="text-sm text-[var(--text-muted)] dark:text-[var(--text-muted-dark)] mt-2"
        ></p>
      </div>
      <div
        id="blog-grid"
        class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </main>
    <div id="footer-root"></div>
    <button id="back-to-top" aria-label="Back to top">
      <i data-lucide="arrow-up" class="w-4 h-4"></i>
    </button>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script type="module">
      import {
        bootLayout,
        initIcons,
        initAnimations,
      } from "../assets/js/layout.js";
      import { getTagBySlug, tags } from "../data/tags.js";
      import { getBlogsByTag } from "../data/blogs.js";
      import {
        renderBlogCard,
        bindBookmarkButtons,
      } from "../components/blog-card.js";
      import { qs } from "../assets/js/utils.js";

      bootLayout("tags/");

      const slug = qs("slug");
      const tag = getTagBySlug(slug) || tags[0];
      const posts = getBlogsByTag(tag.id);

      document.getElementById("page-title").textContent =
        `#${tag.name} — Elmate Stationery Blogs`;
      document
        .getElementById("meta-description")
        .setAttribute(
          "content",
          `Articles tagged #${tag.name} on Elmate Stationery Blogs.`,
        );
      document.getElementById("tag-title").textContent = `#${tag.name}`;
      document.getElementById("results-count").textContent =
        `${posts.length} article${posts.length === 1 ? "" : "s"} tagged #${tag.name}`;

      document.getElementById("blog-grid").innerHTML = posts.length
        ? posts.map((b) => renderBlogCard(b)).join("")
        : `<p class="col-span-full text-center py-16 text-[var(--text-muted)] dark:text-[var(--text-muted-dark)]">No articles with this tag yet.</p>`;

      bindBookmarkButtons();
      initIcons();
      initAnimations();
    </script>
  </body>
</html>
