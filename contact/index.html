<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Marginalia</title>
<meta name="description" content="Get in touch with Marginalia." />
<link rel="icon" href="../public/favicon/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: {
    display: ["Space Grotesk", "sans-serif"], body: ["Source Serif 4", "serif"], mono: ["IBM Plex Mono", "monospace"],
  } } } };
</script>
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
</head>
<body class="font-body antialiased">
<div id="navbar-root"></div>
<div id="search-modal-root"></div>
<main id="main-content" class="max-w-4xl mx-auto px-4 sm:px-6 py-14">
  <div data-aos="fade-up">
    <span class="annotation font-mono text-xs">Get in touch</span>
    <h1 class="font-display text-3xl sm:text-4xl font-semibold mt-2 mb-4">Contact</h1>
    <p class="text-[var(--text-muted)] dark:text-[var(--text-muted-dark)] max-w-lg">Questions, corrections, or a topic you'd like covered — send a note.</p>
  </div>

  <div class="grid md:grid-cols-[1fr,1.3fr] gap-10 mt-10">
    <div class="space-y-5" data-aos="fade-up">
      <div class="flex items-start gap-3">
        <i data-lucide="mail" class="w-4 h-4 mt-1 text-[var(--pine)]"></i>
        <div>
          <p class="text-sm font-medium">Email</p>
          <p id="contact-email" class="text-sm text-[var(--text-muted)] dark:text-[var(--text-muted-dark)]"></p>
        </div>
      </div>
      <div class="flex items-start gap-3">
        <i data-lucide="map-pin" class="w-4 h-4 mt-1 text-[var(--pine)]"></i>
        <div>
          <p class="text-sm font-medium">Location</p>
          <p id="contact-location" class="text-sm text-[var(--text-muted)] dark:text-[var(--text-muted-dark)]"></p>
        </div>
      </div>
    </div>

    <form id="contact-form" class="space-y-4" data-aos="fade-up">
      <div>
        <label for="name" class="text-sm font-medium block mb-1.5">Name</label>
        <input id="name" name="name" required class="w-full px-4 py-2.5 rounded border rule bg-transparent text-sm focus:outline-none" />
      </div>
      <div>
        <label for="email" class="text-sm font-medium block mb-1.5">Email</label>
        <input id="email" name="email" type="email" required class="w-full px-4 py-2.5 rounded border rule bg-transparent text-sm focus:outline-none" />
      </div>
      <div>
        <label for="message" class="text-sm font-medium block mb-1.5">Message</label>
        <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2.5 rounded border rule bg-transparent text-sm focus:outline-none"></textarea>
      </div>
      <button type="submit" class="btn-primary">Send message</button>
      <p id="form-status" class="text-sm" role="status"></p>
    </form>
  </div>
</main>
<div id="footer-root"></div>
<button id="back-to-top" aria-label="Back to top"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script type="module">
  import { bootLayout, initIcons, initAnimations } from "../assets/js/layout.js";
  import { siteConfig } from "../data/config.js";
  bootLayout("contact/");

  document.getElementById("contact-email").textContent = siteConfig.contact.email;
  document.getElementById("contact-location").textContent = siteConfig.contact.location;

  const form = document.getElementById("contact-form");
  const status = document.getElementById("form-status");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const endpoint = siteConfig.contact.formspreeEndpoint;
    if (!endpoint) {
      status.textContent = "Thanks — this form will send once a Formspree endpoint is set in data/config.js.";
      form.reset();
      return;
    }
    try {
      const res = await fetch(endpoint, { method: "POST", headers: { Accept: "application/json" }, body: new FormData(form) });
      status.textContent = res.ok ? "Message sent — thanks for reaching out." : "Something went wrong. Please try again.";
      if (res.ok) form.reset();
    } catch {
      status.textContent = "Network error. Please try again.";
    }
  });

  initIcons();
  initAnimations();
</script>
</body>
</html>
