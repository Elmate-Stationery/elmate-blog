name: Deploy site

# Runs on every push to main. Compiles the Tailwind stylesheet, prerenders a
# static page per post (blog/<slug>/index.html, so crawlers get real content
# and meta tags), and regenerates sitemap.xml + rss.xml from data/blogs.js,
# then deploys to GitHub Pages. No commit is made back to the repo — the
# generated files are only part of the deployed artifact, so the source files
# stay the single source of truth.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Tailwind CSS, prerendered posts, sitemap + RSS)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
