<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Elmate Stationery Blogs</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="public/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              display: ["Space Grotesk", "sans-serif"],
              body: ["Source Serif 4", "serif"],
              mono: ["IBM Plex Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="font-body antialiased">
    <div id="navbar-root"></div>
    <main
      id="main-content"
      class="max-w-xl mx-auto px-4 sm:px-6 py-24 text-center"
    >
      <svg viewBox="0 0 200 140" class="w-56 mx-auto mb-8" aria-hidden="true">
        <rect
          x="20"
          y="20"
          width="160"
          height="100"
          rx="6"
          fill="none"
          stroke="var(--rule)"
          stroke-width="2"
        />
        <line
          x1="20"
          y1="46"
          x2="180"
          y2="46"
          stroke="var(--rule)"
          stroke-width="2"
        />
        <circle cx="34" cy="33" r="3" fill="var(--rule)" />
        <circle cx="46" cy="33" r="3" fill="var(--rule)" />
        <circle cx="58" cy="33" r="3" fill="var(--rule)" />
        <text
          x="100"
          y="92"
          text-anchor="middle"
          font-family="'IBM Plex Mono', monospace"
          font-size="34"
          fill="var(--pine)"
        >
          404
        </text>
        <line
          x1="60"
          y1="105"
          x2="140"
          y2="105"
          stroke="var(--ochre)"
          stroke-width="2"
          stroke-dasharray="4 3"
        />
      </svg>
      <span class="annotation font-mono text-xs">Lost page</span>
      <h1 class="font-display text-2xl sm:text-3xl font-semibold mt-2 mb-3">
        This page isn't in the notebook.
      </h1>
      <p
        class="text-[var(--text-muted)] dark:text-[var(--text-muted-dark)] mb-8"
      >
        The page you're looking for doesn't exist or may have moved.
      </p>
      <a href="./" class="btn-primary">Go home</a>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script type="module">
      import { bootLayout, initIcons } from "./assets/js/layout.js";
      bootLayout("");
      initIcons();
    </script>
  </body>
</html>
